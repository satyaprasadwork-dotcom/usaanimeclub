<title id="t">Skybound Stories: original anime-inspired rooftop traveler</title>
<desc id="d">An original blue-haired young traveler with a wind-swept jacket sits overlooking a luminous coastal city, a brilliant moon and drifting storybook pages. No headphones.</desc>
