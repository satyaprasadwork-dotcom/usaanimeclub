name: Submit USA Anime Club pages to Bing IndexNow
on:
  push:
    paths:
      - ".github/workflows/submit-indexnow.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  submit:
    name: Notify Bing of all published page URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check page list against sitemap
        run: |
          node --input-type=module -e "
          import fs from 'node:fs';
          const origin = 'https://usaanimeclub.com';
          const pages = JSON.parse(fs.readFileSync('content/catalog.json','utf8')).filter(p=>p.status !== 'draft');
          const sitemap = fs.readFileSync('sitemap.xml','utf8');
          const urls = [...sitemap.matchAll(/<loc>([^<]+)<\\/loc>/g)].map(match => match[1]);
          if (pages.length !== urls.length || new Set(urls).size !== pages.length || pages.some(p => !urls.includes(origin + p.path))) {
            throw Error('Sitemap and published pages do not match');
          }
          console.log('All published page URLs ready for IndexNow:',pages.length);
          "
      - name: Submit published URLs to Bing IndexNow
        run: node scripts/submit-indexnow.mjs
