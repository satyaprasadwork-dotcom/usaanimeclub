name: Build and validate static website
on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "templates/**"
      - "scripts/**"
      - "assets/**"
      - "package.json"
      - ".github/workflows/site-validation.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate high-resolution WebP for reliable hosting delivery
        run: |
          if [ ! -f assets/home-concept-scene-hd-2x.webp ] || [ assets/home-concept-scene-hd-2x.avif -nt assets/home-concept-scene-hd-2x.webp ]; then
            if ! command -v ffmpeg >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
            fi
            ffmpeg -hide_banner -loglevel error -y -i assets/home-concept-scene-hd-2x.avif -frames:v 1 -c:v libwebp -q:v 84 assets/home-concept-scene-hd-2x.webp
          fi
          test -s assets/home-concept-scene-hd-2x.webp
      - name: Check published JavaScript syntax
        run: |
          node --check assets/site.js
          node --check assets/home-motion.js
          node --check scripts/validate-home.mjs
          node --check scripts/validate-blue-palette.mjs
          node --check assets/tools.js
          node --check assets/tool-suite.js
          node --check scripts/test-tool-suite.mjs
          node --check assets/tracking.js
          node --check scripts/build.mjs
          node --check scripts/validate.mjs
          node --check scripts/validate-integrations.mjs
          node --check scripts/validate-editorial.mjs
          node --check scripts/validate-seo.mjs
          node --check scripts/check-external-links.mjs
      - name: Generate site from content
        run: npm run build
      - name: Validate published pages
        run: npm run validate
      - name: Validate SEO, AEO and AI-search structured data
        run: npm run audit:seo
      - name: Exercise every new tool and header navigation
        run: node scripts/test-tool-suite.mjs
      - name: Validate GA4, Clarity, AdSense and crawler consistency
        run: npm run audit:integrations
      - name: Validate homepage motion, links and accessible controls
        run: npm run test:home
      - name: Validate editorial evidence, authorship and repeated content
        run: node scripts/validate-editorial.mjs
      - name: Validate US anime editorial identity
        run: node scripts/validate-blue-palette.mjs
      - name: Audit external citation URLs (advisory; not a factual review)
        continue-on-error: true
        run: npm run audit:external
      - name: Verify generated files
        run: npm run build:check
      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html guides press about privacy editorial-policy editorial-review contact community-guidelines terms disclaimer tools sitemap.xml robots.txt llms.txt assets/home-concept-scene-hd-2x.webp deployment-version.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate site from editorial sources [skip ci]"
            git push
          fi
      # GitHub build success is not production deployment. Check Hostinger AFTER committing.
      - name: Verify live Hostinger deployment matches generated source
        env:
          LIVE_AUDIT_ALL: "1"
        run: |
          for attempt in 1 2 3 4 5; do
            if npm run audit:live > "$RUNNER_TEMP/uac-live-audit.log" 2>&1; then
              tail -n 5 "$RUNNER_TEMP/uac-live-audit.log"
              echo "Live website is serving the expected generated build."
              exit 0
            fi
            echo "::warning::Attempt $attempt/5: Hostinger does not yet match GitHub main."
            if [ "$attempt" -lt 5 ]; then sleep 12; fi
          done
          tail -n 85 "$RUNNER_TEMP/uac-live-audit.log"
          echo "::error::GitHub generated files successfully, but the production website is outdated or unavailable. Check Hostinger > Websites > Manage > Advanced > Git, the main branch, document root, auto-deployment and CDN cache."
          exit 1
