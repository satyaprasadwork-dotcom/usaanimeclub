name: Build and validate static website
on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "templates/**"
      - "scripts/**"
      - "assets/**"
      - "package.json"
      - ".github/workflows/site-validation.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate site from content
        run: npm run build
      - name: Validate published pages
        run: npm run validate
      - name: Verify generated files
        run: npm run build:check
      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html guides about privacy editorial-policy editorial-review contact community-guidelines terms disclaimer tools sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate site from editorial sources [skip ci]"
            git push
          fi
