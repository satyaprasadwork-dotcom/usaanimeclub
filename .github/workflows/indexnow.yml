name: Notify Bing and IndexNow of new USA Anime Club articles and Boruto backfill
on:
  workflow_run:
    workflows: ["Build and validate USA Anime Club"]
    types: [completed]
  schedule:
    - cron: "11 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: usa-anime-new-article-indexnow
  cancel-in-progress: false
jobs:
  indexnow:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check URL selection syntax
        run: |
          node --check scripts/indexnow.mjs
          node --check scripts/indexnow-urls.mjs
      - name: Preview new article URLs and one-time Boruto 1-20 backfill
        run: node scripts/indexnow.mjs --dry-run
      - name: Verify live deployment and submit targeted IndexNow URLs
        run: node scripts/indexnow.mjs
      - name: Record only URLs confirmed by IndexNow
        run: |
          if git diff --quiet -- content/indexnow-notified.json content/indexnow-boruto-backfill.json; then
            echo "No newly confirmed URLs to record."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/indexnow-notified.json content/indexnow-boruto-backfill.json
          git commit -m "chore(indexnow): remember newly notified article URLs [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
