name: Notify Bing and IndexNow of new USA Anime Club articles
on:
  workflow_run:
    workflows: ["Build and validate USA Anime Club"]
    types: [completed]
  schedule:
    - cron: "11 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: usa-anime-indexnow
  cancel-in-progress: false
jobs:
  indexnow:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Notify IndexNow about new published articles only
        run: node scripts/indexnow.mjs
      - name: Persist accepted article URLs to avoid repeated submissions
        run: |
          if git diff --quiet -- .github/indexnow-submitted-articles.json; then
            echo "No new article URLs accepted; ledger unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/indexnow-submitted-articles.json
          git commit -m "chore: record new article URLs accepted by IndexNow"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Saved accepted new article URLs. No previously submitted URLs will be resent."
              exit 0
            fi
            echo "::warning::Concurrent repository update; retrying ledger push ($attempt)."
          done
          echo "::error::Could not persist IndexNow article submission ledger."
          exit 1
